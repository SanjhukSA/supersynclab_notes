[project]
name = "supernotes"
version = "1.0.0"
description = "AI-powered study engine for college undergraduates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "**/migrations/versions/*",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "B008", # do not perform function calls in argument defaults (standard FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "deps", "routers", "services", "workers", "llm", "schemas"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
